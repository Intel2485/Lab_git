<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-titles">
            <h1>Мій особистий блог</h1>
            <h2>Олександр Марусиченко</h2>
        </div>
        <nav class="header-nav">
            <a href="#">Вхід</a>
            <a href="https://github.com/Intel2485/Labs_WEB/blob/main/Lab11/HTML/MarusychenkoLab11-00.html">Реєстрація</a>
        </nav>
    </header>

    <main class="content">
        <form class="registration-form">
            
            <div class="form-header">
                <h3>Реєстрація користувача</h3>
            </div>
            <div class="form-body">
                
            <div class="form-group">
                <label for="lastname">Прізвище</label>
                <input type="text" id="lastname" name="lastname">
            </div>  

            <div class="form-group">
                <label for="login">Логін</label>
                <input type="text" id="login" name="login">
            </div>
           
            <div class="form-group">
                    <label for="group">Навчальна група</label>
                    <select id="group" name="group">
                        <option value="123">123</option>
                        <option value="281">281</option>
                    </select>
            </div>

            <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                    <label for="confirm_password">Підтвердження паролю</label>
                    <input type="password" id="confirm_password" name="confirm_password">
            </div>

            <div class="form-group btn-group">
                    <button type="submit" class="submit-btn">Зареєструватись</button>
            </div>

         </div>
        </form>
    </main>

    <footer class="main-footer">
        <p>© Всі права захищені.</p>
        <p>Розробник: студент Олександр Марусиченко</p>
    </footer>
</body>
</html>
